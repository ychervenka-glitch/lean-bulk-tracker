function drawRest(){const box=document.getElementById('restbox');if(!box)return;const sec=Math.max(0,Math.ceil((restEnd-Date.now())/1000));box.style.display=sec>0?'block':'none';document.getElementById('restclock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(!sec&&restEnd){restEnd=0;try{localStorage.removeItem(REST_KEY)}catch(e){}}}
setInterval(drawRest,1000);
function suggest(name){const e=last(name);if(!e)return 'Поки немає попередніх результатів';const work=e.sets.filter(s=>!s.warm&&Number(s.kg)>0&&Number(s.reps)>0);if(!work.length)return 'Немає робочої ваги';const heavy=Math.max(...work.map(s=>Number(s.kg)));const at=work.filter(s=>Number(s.kg)===heavy);const maxR=Math.max(...at.map(s=>Number(s.reps)));const hard=at.some(s=>s.rpe==='🔴');const easy=at.every(s=>s.rpe==='🟢'||s.rpe==='🟡');const step=heavy>=70?2.5:heavy>=30?2:1;let tip=hard?'Залиш вагу або зменш на 2–5%, щоб зберегти техніку.':easy&&maxR>=12?'Можна обережно спробувати '+(heavy+step).toLocaleString('uk-UA')+' кг.':'Повтори цю вагу та спробуй додати 1–2 повторення.';return 'Минулого разу: '+heavy+' кг × '+maxR+' · '+tip+' Орієнтир, не автоматична зміна.'}

function muscleInfo(g,mode){const label=MUSCLE_LABELS[g]||'М’яз';const counts=muscleCounts(mode);const entries=mode==='week'||mode==='month'?state.history.filter(h=>new Date(h.date+'T12:00:00').getTime()>=Date.now()-(mode==='month'?30:7)*86400000).concat([state.draft]):[state.draft];const names=[...new Set(entries.flatMap(d=>(d?.exercises||[]).filter(e=>(muscleGroups[e.name]||[]).includes(g)&&e.sets.some(x=>!x.warm&&(x.done===true||(x.done===undefined&&d!==state.draft)))).map(e=>e.name)))];return `<strong>${label}</strong><div class="muted">${counts[g]||0} робочих підходів${names.length?' · '+names.map(esc).join(', '):' · ще немає виконаних підходів'}</div>`}
function graphSvg(name){const rows=state.history.filter(h=>h.exercises.some(e=>e.name===name)).map(h=>{const e=h.exercises.find(e=>e.name===name);const work=e.sets.filter(s=>!s.warm&&Number(s.kg)>0);return {date:h.date,weight:work.length?Math.max(...work.map(s=>Number(s.kg))):0}}).filter(x=>x.weight>0).sort((a,b)=>a.date.localeCompare(b.date));if(!rows.length)return '<p class="notice">Поки немає завершених записів для графіка.</p>';const max=Math.max(...rows.map(r=>r.weight)),min=Math.min(0,...rows.map(r=>r.weight));const pts=rows.map((r,i)=>[35+(rows.length===1?130:i*260/(rows.length-1)),175-(r.weight-min)/(max-min||1)*135]);return `<svg class="chart" viewBox="0 0 340 210" role="img" aria-label="Прогрес робочої ваги"><path d="M35 20V175H325" fill="none" stroke="#69717c" stroke-width="1"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff922e" stroke-width="3"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff922e"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" fill="#fff" font-size="11">${rows[i].weight} кг</text><text x="${p[0]}" y="193" text-anchor="middle" fill="#aeb5c0" font-size="9">${rows[i].date.slice(5)}</text>`).join('')}</svg><p class="legend">Максимальна робоча вага за тренування. ${rows.length} запис(ів).</p>`}
function calendarHtml(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();const first=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const done=new Set(state.history.map(h=>h.date));const labels=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];return `<div class="card"><h3>📅 ${new Intl.DateTimeFormat('uk-UA',{month:'long',year:'numeric'}).format(now)}</h3><div class="calendar">${labels.map(x=>`<div class="legend" style="text-align:center">${x}</div>`).join('')}${Array.from({length:first},()=>'<div class="day empty"></div>').join('')}${Array.from({length:days},(_,i)=>{const day=String(i+1).padStart(2,'0'),date=y+'-'+String(m+1).padStart(2,'0')+'-'+day;return `<button class="day ${done.has(date)?'worked':''}" data-calendar="${date}">${i+1}</button>`}).join('')}</div><p class="legend">Помаранчевий = є запис у локальній історії. Натисни дату для деталей.</p></div>`}
function renderAnalytics(){const names=[...new Set(state.history.flatMap(h=>h.exercises.map(e=>e.name)))];const current=document.getElementById('chartEx')?.value;const name=names.includes(current)?current:(names[0]||'');const mode=['session','week','month'].includes(window.muscleMode)?window.muscleMode:'session';const counts=muscleCounts(mode);document.getElementById('analytics').innerHTML=`<h2>📈 Прогрес</h2><div class="card"><strong>Робоча вага за вправою</strong><select id="chartEx" style="margin-top:10px;text-align:left">${names.map(n=>`<option value="${esc(n)}" ${n===name?'selected':''}>${esc(n)}</option>`).join('')}</select><div id="chartArea">${graphSvg(name)}</div></div><div class="card"><h3>🧍 Анатомічна карта м’язів</h3><div class="maptoggle"><button class="btn2 small ${mode==='session'?'mapchosen':''}" data-map-mode="session">Поточне тренування</button><button class="btn2 small ${mode==='week'?'mapchosen':''}" data-map-mode="week">За 7 днів</button><button class="btn2 small ${mode==='month'?'mapchosen':''}" data-map-mode="month">За 30 днів</button></div><div class="musclemap">${muscleSvg(false,counts)}${muscleSvg(true,counts)}</div><div class="maplegend"><span style="--c:#858d97">0</span><span style="--c:#e99a46">1–3</span><span style="--c:#f47d20">4–6</span><span style="--c:#ffb456">7+</span></div><div id="muscleInfo" class="muscleinfo"><strong>Обери м’яз на схемі</strong><div class="muted">Натисни на підсвічену або сіру ділянку, щоб переглянути вправи та підходи.</div></div><p class="notice">Натисни на будь-який м’яз для деталей. Помаранчевий показує кількість зареєстрованих робочих підходів, а не фізіологічну активацію.</p></div>${calendarHtml()}`}
function totals(d){let sets=0,reps=0,volume=0;for(const e of d.exercises)for(const s of e.sets){if(s.warm||s.done===false)continue;const r=Number(s.reps)||0;sets++;reps+=r;volume+=(Number(s.kg)||0)*r*(e.name==='Incline DB Press'||e.name==='Lateral Raise'?2:1)}return {sets,reps,volume}}function updateLive(){const d=state.draft;if(!d)return;const done=d.exercises.filter(e=>e.sets.some(s=>s.done===true)).length;const t=totals(d);for(const [id,value] of [['liveExercises',done],['liveSets',t.sets],['liveReps',t.reps],['liveVolume',t.volume.toLocaleString('uk-UA')]]){const node=document.getElementById(id);if(node)node.textContent=value}}function setHtml(e,ei){let prev=last(e.name,state.draft.date);return `<div class="card exercise"><div class="exhead"><div class="thumb" data-image="${ei}">${state.images[e.name]?`<img src="${state.images[e.name]}" alt="${esc(e.name)}">`:builtInArt[e.name]?`<img src="${builtInArt[e.name]}" alt="Ілюстрація ${esc(e.name)}" loading="lazy" onerror="this.outerHTML=decodeURIComponent(this.dataset.fallback)" data-fallback="${encodeURIComponent(diagram(e.name))}">`:diagram(e.name)}</div><div style="flex:1"><div class="title">${esc(e.name)}</div><div class="muted">${esc(groups[e.name]||'Силова вправа')}</div><div class="historyline">${prev?`Минулого разу ${prev.date}: ${prev.sets.filter(s=>!s.warm).map(s=>`${s.kg}×${s.reps}`).join(' · ')}`:'Немає попереднього запису'}</div></div></div><div class="hint">🧠 ${esc(suggest(e.name))}</div><div class="tools"><button class="btn2 small" data-change="${ei}">⇄ Замінити</button><label class="btn2 small filelabel">▧ Додати ілюстрацію<input type="file" accept="image/*" data-upload="${ei}" style="display:none"></label></div><div class="gridhead"><span>Тип</span><span>Вага, кг</span><span>Повт.</span><span>RPE</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="setrow"><button class="btn2 small kind" data-warm="${ei}:${si}" title="Перемкнути розминку/робочий">${s.warm?'Р':si+1}</button><input inputmode="decimal" type="number" step="0.5" min="0" data-set="${ei}:${si}:kg" value="${esc(s.kg)}"><input inputmode="numeric" type="number" min="0" data-set="${ei}:${si}:reps" value="${esc(s.reps)}"><select data-set="${ei}:${si}:rpe"><option value="">—</option>${['🟢','🟡','🟠','🔴'].map(r=>`<option ${s.rpe===r?'selected':''}>${r}</option>`).join('')}</select><input type="checkbox" data-set="${ei}:${si}:done" ${s.done?'checked':''} style="accent-color:#ff922e;width:22px;height:22px"></div>`).join('')}<div class="tools"><button class="btn2 small" data-add="${ei}">+ Підхід</button><button class="btn2 small" data-remove="${ei}">− Останній</button></div></div>`}function render(){const d=state.draft,t=totals(d);document.getElementById('train').innerHTML=`<div class="banner saved">✓ Збережено на пристрої</div><div class="topline"><span class="muted">Дата</span><input type="date" id="date" value="${esc(d.date)}"><span class="muted">Програма</span><select id="program">${['A','B','C'].map(x=>`<option value="${x}" ${d.type===x?'selected':''}>Full Body ${x}</option>`).join('')}</select></div><div class="stats"><div class="stat"><strong>${t.sets}</strong><span>Виконані сети</span></div><div class="stat"><strong>${t.reps}</strong><span>Повторення</span></div><div class="stat"><strong>${t.volume.toLocaleString('uk-UA')}</strong><span>Тоннаж, кг</span></div></div><p class="notice">Попередні ваги підставляються як план. Познач ✓ після фактичного виконання. Р = розминка. Для гантелей тоннаж рахується за дві руки.</p>${d.exercises.map(setHtml).join('')}`;document.getElementById('history').innerHTML=`<h2>Історія тренувань</h2>${[...state.history].reverse().map((h,i)=>`<div class="card"><div class="row"><strong>${esc(h.date)} · Full Body ${esc(h.type)}</strong><button class="btn2 small" data-detail="${state.history.length-1-i}">Деталі</button></div><div class="muted">${h.exercises.length} вправ · ${h.exercises.reduce((a,e)=>a+e.sets.filter(s=>!s.warm).length,0)} робочих підходів</div></div>`).join('')}`;updateLive();renderAnalytics();document.getElementById('settings').innerHTML=`<h2>Збереження й перенесення</h2><div class="card"><strong>Локальне збереження</strong><p class="notice">Дані зберігаються у сховищі браузера на цьому пристрої. Якщо очистити дані Safari, відкрити інший домен або змінити пристрій, вони не синхронізуються автоматично. Регулярно роби резервну копію JSON.</p><button class="btn" id="exportBackup">Експортувати JSON</button><label class="btn2 filelabel" style="margin-left:8px">Імпортувати JSON<input type="file" id="importBackup" accept="application/json,.json" hidden></label></div><div class="card"><strong>Ілюстрації</strong><p class="notice">Натисни «Додати ілюстрацію» біля вправи й обери наш оригінальний малюнок з Фото/Файлів. Ілюстрація зберігається локально. Якщо файли з папки illustrations відсутні, показані схематичні піктограми, а не точна техніка вправ.</p></div><div class="card"><strong>Звіт для ChatGPT</strong><p class="notice">Кнопка завершення створює текстовий звіт, який можна скопіювати й надіслати в наш чат. Google Sheets не змінюється без твого окремого підтвердження.</p></div><button class="btn2 btnDanger" id="resetDraft">Почати нову чернетку (з підтвердженням)</button>`}function dialog(html){document.getElementById('modalroot').innerHTML=`<div class="modal"><div class="dialog">${html}<div style="margin-top:12px"><button class="btn2" id="closeModal">Закрити</button></div></div></div>`}function viewArt(ei){const e=state.draft.exercises[ei];if(!e)return;const path=state.images[e.name]||builtInArt[e.name];if(!path)return;dialog(`<h3>${esc(e.name)}</h3><img src="${path}" alt="${esc(e.name)}" style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:#12151b"><p class="muted">Ілюстрація для орієнтації, не замінює інструктаж тренера.</p>`)}
function close(){document.getElementById('modalroot').innerHTML=''}function report(d){let out=`Lean Bulk — Full Body ${d.type}\nДата: ${d.date}\n`;for(const e of d.exercises){out+=`\n${e.name}\n`;e.sets.forEach((s,i)=>{if(s.done!==false)out+=`  ${s.warm?'Розминка':'Робочий'} ${i+1}: ${s.kg||'власна вага'} кг × ${s.reps} ${s.rpe||'RPE не вказано'}\n`})}const t=totals(d);return out+`\nПІДСУМКИ: ${t.sets} робочих сетів; ${t.reps} повторень; ${t.volume} кг тоннажу (без розминок; гантелі ×2).\nПрошу перевірити результати. НЕ записуй у Google Sheets без мого окремого підтвердження.`}function download(filename,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset.set)return;const [ei,si,k]=el.dataset.set.split(':');const s=state.draft.exercises[+ei].sets[+si];s[k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();updateLive()});document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.set){const [ei,si,k]=el.dataset.set.split(':');state.draft.exercises[+ei].sets[+si][k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();if(k==='done'){if(el.checked&&!state.draft.exercises[+ei].sets[+si].warm)startRest(state.draft.exercises[+ei].name);render()}else updateLive();return}if(el.id==='chartEx'){document.getElementById('chartArea').innerHTML=graphSvg(el.value);return}if(el.id==='date'){state.draft.date=el.value;save();render()}if(el.id==='program'){if(confirm('Перемкнути програму? Поточна чернетка буде замінена. Спочатку зроби резервну копію, якщо вона потрібна.'))start(el.value);else render()}if(el.dataset.upload!==undefined){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Вибери зображення до 1,5 МБ, щоб не переповнити локальне сховище.');return}const name=state.draft.exercises[+el.dataset.upload].name;const reader=new FileReader();reader.onload=()=>{state.images[name]=reader.result;save();render()};reader.readAsDataURL(f)}if(el.id==='importBackup'){const f=el.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.history)||!x.draft||typeof x.images!=='object')throw Error();if(confirm('Замінити всі локальні дані резервною копією?')){state=x;save();render()}}catch(e){alert('Неправильний файл резервної копії')}};reader.readAsText(f)}});document.addEventListener('click',async ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===el));for(const t of ['train','history','analytics','settings'])document.getElementById(t).classList.toggle('hidden',t!==el.dataset.tab);document.getElementById('footer').style.display=el.dataset.tab==='train'?'flex':'none'}if(el.id==='restSkip'){restEnd=0;try{localStorage.removeItem(REST_KEY)}catch(e){}drawRest()}if(el.dataset.calendar){const h=state.history.filter(x=>x.date===el.dataset.calendar);dialog(`<h3>${esc(el.dataset.calendar)}</h3>${h.length?h.map(x=>`<div class="preview">${esc(report(x))}</div>`).join(''):'<p class="notice">Немає збереженого тренування.</p>'}`)}if(el.dataset.add!==undefined){let e=state.draft.exercises[+el.dataset.add],p=e.sets[e.sets.length-1];e.sets.push({...p,rpe:'',done:false});save();render()}if(el.dataset.remove!==undefined){let e=state.draft.exercises[+el.dataset.remove];if(e.sets.length>1&&confirm('Видалити останній підхід?')){e.sets.pop();save();render()}}if(el.dataset.warm){let [i,j]=el.dataset.warm.split(':').map(Number);state.draft.exercises[i].sets[j].warm=!state.draft.exercises[i].sets[j].warm;save();render()}if(el.dataset.change!==undefined){const i=+el.dataset.change;dialog(`<h2>Замінити вправу</h2><input id="searchEx" type="text" placeholder="Пошук вправи" style="text-align:left"><div id="options">${catalog.map(n=>`<button class="option" data-choose="${i}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`);document.getElementById('searchEx').addEventListener('input',e=>document.querySelectorAll('#options button').forEach(b=>b.style.display=b.dataset.name.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'))}if(el.dataset.choose!==undefined){const i=+el.dataset.choose;const old=state.draft.exercises[i];if(old.sets.some(s=>s.done)&&!confirm('Замінити вправу та її поточні сети?'))return;state.draft.exercises[i]=makeEx(el.dataset.name);save();close();render()}if(el.dataset.detail!==undefined){const h=state.history[+el.dataset.detail];dialog(`<h2>${esc(h.date)} · Full Body ${esc(h.type)}</h2><div class="preview">${esc(report(h))}</div>`)}if(el.id==='closeModal')close();if(el.id==='backup'||el.id==='exportBackup')download('lean-bulk-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(el.id==='resetDraft'&&confirm('Видалити поточну чернетку? Історія залишиться.'))start(state.draft.type);if(el.id==='finish'){const d=state.draft;const incomplete=d.exercises.flatMap(e=>e.sets).filter(s=>!s.warm&&!s.done);if(incomplete.length&&!confirm(`${incomplete.length} робочих сетів не позначені виконаними. Завершити лише з відміченими сетами?`))return;const textReport=report(d);dialog(`<h2>Звіт тренування</h2><p class="notice">Перевір звіт. Натисни «Копіювати» і надішли його в ChatGPT. Збереження в Google Sheets — тільки після твого підтвердження.</p><div class="preview" id="reportText">${esc(textReport)}</div><div class="tools"><button class="btn" id="copyReport">Копіювати звіт</button><button class="btn2" id="archiveWorkout">Зберегти в історію й почати наступне</button></div>`)}if(el.id==='copyReport'){const str=document.getElementById('reportText').textContent;try{await navigator.clipboard.writeText(str);alert('Звіт скопійовано')}catch(e){download('lean-bulk-report-'+state.draft.date+'.txt',str,'text/plain');alert('Звіт збережено як текстовий файл')}}if(el.id==='archiveWorkout'){const d=structuredClone(state.draft);d.exercises=d.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>{delete s.done;return s})})).filter(e=>e.sets.length);if(state.history.some(h=>h.date===d.date&&h.type===d.type)){if(!confirm('Уже є тренування з цією датою й типом. Замінити його?'))return;state.history=state.history.filter(h=>!(h.date===d.date&&h.type===d.type))}state.history.push(d);state.history.sort((a,b)=>a.date.localeCompare(b.date));const next={A:'B',B:'C',C:'A'}[d.type];state.draft={date:today(),type:next,exercises:programs[next].map(makeEx)};save();close();render();alert('Тренування збережено в локальній історії. Звіт потрібно окремо надіслати в ChatGPT.')}});document.addEventListener('click',e=>{const toggle=e.target.closest('[data-map-mode]');if(toggle){window.muscleMode=toggle.dataset.mapMode;renderAnalytics();return}const region=e.target.closest('[data-muscle]');if(region){const info=document.getElementById('muscleInfo');if(info)info.innerHTML=muscleInfo(region.dataset.muscle,['session','week','month'].includes(window.muscleMode)?window.muscleMode:'session');document.querySelectorAll('.muscle-region').forEach(p=>p.classList.toggle('muscle-selected',p.dataset.muscle===region.dataset.muscle))}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-muscle]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('click',e=>{const thumb=e.target.closest('[data-image]');if(thumb)viewArt(Number(thumb.dataset.image))});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
