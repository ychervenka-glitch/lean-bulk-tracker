function muscleLayers(mode){
 const days=mode==='today'?1:mode==='two'?2:mode==='four'?4:6;
 const layers=[{},{},{},{}], now=new Date(today()+'T12:00:00');
 // Keep the current, unarchived workout visible immediately, even when a
 // historical session has the same date and program type.

 if(state.draft?.exercises?.some(e=>(e.sets||[]).some(x=>x.done===true))){
   entries.push({session:state.draft,live:true});
 }
 for(const {session:h,live} of entries){
   // Live checked sets belong to today's visualization; the original draft
   // date remains unchanged for the user's eventual report/confirmation.
   const sessionDate=live?today():h.date;
   const age=Math.round((now-new Date(sessionDate+'T12:00:00'))/86400000);
   if(age<0||age>=days)continue;
   const index=age===0?0:age===1?1:age<=3?2:3;
   for(const e of h.exercises||[]){
     const n=(e.sets||[]).filter(x=>!x.warm && (live?x.done===true:(x.done!==false))).length;
     if(!n)continue;
     for(const g of muscleGroups[e.name]||[])layers[index][g]=(layers[index][g]||0)+n;
   }
 }
 return layers;
}

function muscleInfo(g,mode){const l=muscleLayers(mode),n=l.reduce((a,x)=>a+(x[g]||0),0);return `<strong>${MUSCLE_LABELS[g]||g}</strong><div class="muted">${n} робочих підходів · 🔴 сьогодні ${l[0][g]||0} · 🟠 учора ${l[1][g]||0} · 🟡 2–3 дні тому ${l[2][g]||0} · 🟢 4–5 днів тому ${l[3][g]||0}</div>`}
function graphSvg(name){const rows=state.history.filter(h=>h.exercises.some(e=>e.name===name)).map(h=>{const e=h.exercises.find(e=>e.name===name);const work=e.sets.filter(s=>!s.warm&&Number(s.kg)>0);return {date:h.date,weight:work.length?Math.max(...work.map(s=>Number(s.kg))):0}}).filter(x=>x.weight>0).sort((a,b)=>a.date.localeCompare(b.date));if(!rows.length)return '<p class="notice">Поки немає завершених записів для графіка.</p>';const max=Math.max(...rows.map(r=>r.weight)),min=Math.min(0,...rows.map(r=>r.weight));const pts=rows.map((r,i)=>[35+(rows.length===1?130:i*260/(rows.length-1)),175-(r.weight-min)/(max-min||1)*135]);return `<svg class="chart" viewBox="0 0 340 210" role="img" aria-label="Прогрес робочої ваги"><path d="M35 20V175H325" fill="none" stroke="#69717c" stroke-width="1"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff922e" stroke-width="3"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff922e"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" fill="#fff" font-size="11">${rows[i].weight} кг</text><text x="${p[0]}" y="193" text-anchor="middle" fill="#aeb5c0" font-size="9">${rows[i].date.slice(5)}</text>`).join('')}</svg><p class="legend">Максимальна робоча вага за тренування. ${rows.length} запис(ів).</p>`}
function calendarHtml(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();const first=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const done=new Set(state.history.map(h=>h.date));const labels=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];return `<div class="card"><h3>📅 ${new Intl.DateTimeFormat('uk-UA',{month:'long',year:'numeric'}).format(now)}</h3><div class="calendar">${labels.map(x=>`<div class="legend" style="text-align:center">${x}</div>`).join('')}${Array.from({length:first},()=>'<div class="day empty"></div>').join('')}${Array.from({length:days},(_,i)=>{const day=String(i+1).padStart(2,'0'),date=y+'-'+String(m+1).padStart(2,'0')+'-'+day;return `<button class="day ${done.has(date)?'worked':''}" data-calendar="${date}">${i+1}</button>`}).join('')}</div><p class="legend">Помаранчевий = є запис у локальній історії. Натисни дату для деталей.</p></div>`}
function renderAnalytics(){const names=[...new Set(state.history.flatMap(h=>h.exercises.map(e=>e.name)))];const current=document.getElementById('chartEx')?.value;const name=names.includes(current)?current:(names[0]||'');const mode=['today','two','four','six'].includes(window.muscleMode)?window.muscleMode:'six';const layers=muscleLayers(mode);document.getElementById('analytics').innerHTML=`<h2>📈 Прогрес</h2><div class="card"><strong>Робоча вага за вправою</strong><select id="chartEx" style="margin-top:10px;text-align:left">${names.map(n=>`<option value="${esc(n)}" ${n===name?'selected':''}>${esc(n)}</option>`).join('')}</select><div id="chartArea">${graphSvg(name)}</div></div><div class="card"><h3>🧍 Анатомічна карта м’язів</h3><div class="maptoggle"><button class="btn2 small ${mode==='today'?'mapchosen':''}" data-map-mode="today">Сьогодні</button><button class="btn2 small ${mode==='two'?'mapchosen':''}" data-map-mode="two">2 дні</button><button class="btn2 small ${mode==='four'?'mapchosen':''}" data-map-mode="four">4 дні</button><button class="btn2 small ${mode==='six'?'mapchosen':''}" data-map-mode="six">6 днів</button></div><div class="musclemap">${muscleSvg(false,layers)}${muscleSvg(true,layers)}</div><div class="maplegend"><span style="--c:#ff353c">Сьогодні</span><span style="--c:#ff9027">Учора</span><span style="--c:#ffd43b">2–3 дні тому</span><span style="--c:#39ca73">4–5 днів тому</span></div><div id="muscleInfo" class="muscleinfo"><strong>Обери м’яз на схемі</strong><div class="muted">Натисни на підсвічену або сіру ділянку, щоб переглянути вправи та підходи.</div></div><p class="notice">Натисни на будь-який м’яз для деталей. Кожен м’яз має один колір за найновішим тренуванням: 🔴 сьогодні, 🟠 учора, 🟡 2–3 дні тому, 🟢 4–5 днів тому. Це історія робочих підходів, а не фізіологічна активація.</p></div>${calendarHtml()}`}
function totals(d){let sets=0,reps=0,volume=0;for(const e of d.exercises)for(const s of e.sets){if(s.warm||s.done===false)continue;const r=Number(s.reps)||0;sets++;reps+=r;volume+=(Number(s.kg)||0)*r*(e.name==='Incline DB Press'||e.name==='Lateral Raise'?2:1)}return {sets,reps,volume}}function updateLive(){const d=state.draft;if(!d)return;const done=d.exercises.filter(e=>e.sets.some(s=>s.done===true)).length;const t=totals(d);for(const [id,value] of [['liveExercises',done],['liveSets',t.sets],['liveReps',t.reps],['liveVolume',t.volume.toLocaleString('uk-UA')]]){const node=document.getElementById(id);if(node)node.textContent=value}}function setHtml(e,ei){let prev=last(e.name,state.draft.date);return `<div class="card exercise"><div class="exhead"><div class="thumb" data-image="${ei}">${state.images[e.name]?`<img src="${state.images[e.name]}" alt="${esc(e.name)}">`:builtInArt[e.name]?`<img src="${builtInArt[e.name]}" alt="Ілюстрація ${esc(e.name)}" loading="lazy" onerror="this.outerHTML=decodeURIComponent(this.dataset.fallback)" data-fallback="${encodeURIComponent(diagram(e.name))}">`:diagram(e.name)}</div><div style="flex:1"><div class="title">${esc(e.name)}</div><div class="muted">${esc(groups[e.name]||'Силова вправа')}</div><div class="historyline">${prev?`Минулого разу ${prev.date}: ${prev.sets.filter(s=>!s.warm).map(s=>`${s.kg}×${s.reps}`).join(' · ')}`:'Немає попереднього запису'}</div></div></div><div class="hint">🧠 ${esc(suggest(e.name))}</div><div class="tools"><button class="btn2 small" data-change="${ei}">⇄ Замінити</button><label class="btn2 small filelabel">▧ Додати ілюстрацію<input type="file" accept="image/*" data-upload="${ei}" style="display:none"></label></div><div class="gridhead"><span>Тип</span><span>Вага, кг</span><span>Повт.</span><span>RPE</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="setrow"><button class="btn2 small kind" data-warm="${ei}:${si}" title="Перемкнути розминку/робочий">${s.warm?'Р':si+1}</button><input inputmode="decimal" type="number" step="0.5" min="0" data-set="${ei}:${si}:kg" value="${esc(s.kg)}"><input inputmode="numeric" type="number" min="0" data-set="${ei}:${si}:reps" value="${esc(s.reps)}"><select data-set="${ei}:${si}:rpe"><option value="">—</option>${['🟢','🟡','🟠','🔴'].map(r=>`<option ${s.rpe===r?'selected':''}>${r}</option>`).join('')}</select><input type="checkbox" data-set="${ei}:${si}:done" ${s.done?'checked':''} style="accent-color:#ff922e;width:22px;height:22px"></div>`).join('')}<div class="tools"><button class="btn2 small" data-add="${ei}">+ Підхід</button><button class="btn2 small" data-remove="${ei}">− Останній</button></div></div>`}function render(){const d=state.draft,t=totals(d);document.getElementById('train').innerHTML=`<div class="banner saved">✓ Збережено на пристрої</div><div class="topline"><span class="muted">Дата</span><input type="date" id="date" value="${esc(d.date)}"><span class="muted">Програма</span><select id="program">${['A','B','C'].map(x=>`<option value="${x}" ${d.type===x?'selected':''}>Full Body ${x}</option>`).join('')}</select></div><div class="stats"><div class="stat"><strong>${t.sets}</strong><span>Виконані сети</span></div><div class="stat"><strong>${t.reps}</strong><span>Повторення</span></div><div class="stat"><strong>${t.volume.toLocaleString('uk-UA')}</strong><span>Тоннаж, кг</span></div></div><p class="notice">Попередні ваги підставляються як план. Познач ✓ після фактичного виконання. Р = розминка. Для гантелей тоннаж рахується за дві руки.</p>${d.exercises.map(setHtml).join('')}`;document.getElementById('history').innerHTML=`<h2>Історія тренувань</h2>${[...state.history].reverse().map((h,i)=>`<div class="card"><div class="row"><strong>${esc(h.date)} · Full Body ${esc(h.type)}</strong><button class="btn2 small" data-detail="${state.history.length-1-i}">Деталі</button></div><div class="muted">${h.exercises.length} вправ · ${h.exercises.reduce((a,e)=>a+e.sets.filter(s=>!s.warm).length,0)} робочих підходів</div></div>`).join('')}`;updateLive();renderAnalytics();document.getElementById('settings').innerHTML=`<h2>Збереження й перенесення</h2><div class="card"><strong>Локальне збереження</strong><p class="notice">Дані зберігаються у сховищі браузера на цьому пристрої. Якщо очистити дані Safari, відкрити інший домен або змінити пристрій, вони не синхронізуються автоматично. Регулярно роби резервну копію JSON.</p><button class="btn" id="exportBackup">Експортувати JSON</button><label class="btn2 filelabel" style="margin-left:8px">Імпортувати JSON<input type="file" id="importBackup" accept="application/json,.json" hidden></label></div><div class="card"><strong>☁️ Google Sheets · ручна синхронізація</strong><p class="notice">Вкажи адресу вебдодатка Apps Script (/exec) та секретний токен із Script Properties. Токен зберігається тільки у сховищі цього браузера, не в HTML і не в резервній копії. Не передавай його в чат або GitHub.</p><label class="measure-field">Адреса Apps Script<input id="syncUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" style="text-align:left"></label><label class="measure-field" style="margin-top:10px">Секретний токен<input id="syncToken" type="password" autocomplete="off" placeholder="LEAN_BULK_TOKEN" style="text-align:left"></label><div class="tools"><button class="btn2" id="syncSave">Зберегти налаштування</button><button class="btn" id="syncSend">Надіслати тренування та заміри</button><button class="btn2 btnDanger" id="syncClear">Забути токен</button></div><p id="syncStatus" class="notice" role="status">Синхронізація ще не запускалась.</p><p class="notice">Увага: через обмеження браузера відповідь Apps Script на запит з GitHub Pages може бути недоступна. Відправлення не дорівнює підтвердженому запису: результат перевіряй у Google Таблиці. Повторне надсилання використовує ті самі ID.</p></div><div class="card"><strong>Ілюстрації</strong><p class="notice">Натисни «Додати ілюстрацію» біля вправи й обери наш оригінальний малюнок з Фото/Файлів. Ілюстрація зберігається локально. Якщо файли з папки illustrations відсутні, показані схематичні піктограми, а не точна техніка вправ.</p></div><div class="card"><strong>Звіт для ChatGPT</strong><p class="notice">Кнопка завершення створює текстовий звіт, який можна скопіювати й надіслати в наш чат. Google Sheets не змінюється без твого окремого підтвердження.</p></div><button class="btn2 btnDanger" id="resetDraft">Почати нову чернетку (з підтвердженням)</button>`}function dialog(html){document.getElementById('modalroot').innerHTML=`<div class="modal"><div class="dialog">${html}<div style="margin-top:12px"><button class="btn2" id="closeModal">Закрити</button></div></div></div>`}function viewArt(ei){const e=state.draft.exercises[ei];if(!e)return;const path=state.images[e.name]||builtInArt[e.name];if(!path)return;dialog(`<h3>${esc(e.name)}</h3><img src="${path}" alt="${esc(e.name)}" style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:#12151b"><p class="muted">Ілюстрація для орієнтації, не замінює інструктаж тренера.</p>`)}
function close(){document.getElementById('modalroot').innerHTML=''}function report(d){let out=`Lean Bulk — Full Body ${d.type}\nДата: ${d.date}\n`;for(const e of d.exercises){out+=`\n${e.name}\n`;e.sets.forEach((s,i)=>{if(s.done!==false)out+=`  ${s.warm?'Розминка':'Робочий'} ${i+1}: ${s.kg||'власна вага'} кг × ${s.reps} ${s.rpe||'RPE не вказано'}\n`})}const t=totals(d);return out+`\nПІДСУМКИ: ${t.sets} робочих сетів; ${t.reps} повторень; ${t.volume} кг тоннажу (без розминок; гантелі ×2).\nПрошу перевірити результати. НЕ записуй у Google Sheets без мого окремого підтвердження.`}function download(filename,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset.set)return;const [ei,si,k]=el.dataset.set.split(':');const s=state.draft.exercises[+ei].sets[+si];s[k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();updateLive()});document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.set){const [ei,si,k]=el.dataset.set.split(':');state.draft.exercises[+ei].sets[+si][k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();if(k==='done'){if(el.checked){unlockRestAudio();startRest(state.draft.exercises[+ei].name);}render();if(!document.getElementById('analytics').classList.contains('hidden'))renderAnalytics()}else updateLive();return}if(el.id==='chartEx'){document.getElementById('chartArea').innerHTML=graphSvg(el.value);return}if(el.id==='date'){state.draft.date=el.value;save();render()}if(el.id==='program'){if(confirm('Перемкнути програму? Поточна чернетка буде замінена. Спочатку зроби резервну копію, якщо вона потрібна.'))start(el.value);else render()}if(el.dataset.upload!==undefined){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Вибери зображення до 1,5 МБ, щоб не переповнити локальне сховище.');return}const name=state.draft.exercises[+el.dataset.upload].name;const reader=new FileReader();reader.onload=()=>{state.images[name]=reader.result;save();render()};reader.readAsDataURL(f)}if(el.id==='importBackup'){const f=el.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.history)||!x.draft||typeof x.images!=='object')throw Error();if(confirm('Замінити всі локальні дані резервною копією?')){state=x;save();render()}}catch(e){alert('Неправильний файл резервної копії')}};reader.readAsText(f)}});document.addEventListener('click',async ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.tab){if(el.dataset.tab==='analytics')renderAnalytics();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===el));for(const t of ['train','history','analytics','measurements','settings'])document.getElementById(t).classList.toggle('hidden',t!==el.dataset.tab);document.getElementById('footer').style.display=el.dataset.tab==='train'?'flex':'none'}if(el.id==='testSound')testRestSound();if(el.id==='restSkip'){restEnd=0;try{localStorage.removeItem(REST_KEY)}catch(e){}drawRest()}if(el.dataset.calendar){const h=state.history.filter(x=>x.date===el.dataset.calendar);dialog(`<h3>${esc(el.dataset.calendar)}</h3>${h.length?h.map(x=>`<div class="preview">${esc(report(x))}</div>`).join(''):'<p class="notice">Немає збереженого тренування.</p>'}`)}if(el.dataset.add!==undefined){let e=state.draft.exercises[+el.dataset.add],p=e.sets[e.sets.length-1];e.sets.push({...p,rpe:'',done:false});save();render()}if(el.dataset.remove!==undefined){let e=state.draft.exercises[+el.dataset.remove];if(e.sets.length>1&&confirm('Видалити останній підхід?')){e.sets.pop();save();render()}}if(el.dataset.warm){let [i,j]=el.dataset.warm.split(':').map(Number);state.draft.exercises[i].sets[j].warm=!state.draft.exercises[i].sets[j].warm;save();render()}if(el.dataset.change!==undefined){const i=+el.dataset.change;dialog(`<h2>Замінити вправу</h2><input id="searchEx" type="text" placeholder="Пошук вправи" style="text-align:left"><div id="options">${catalog.map(n=>`<button class="option" data-choose="${i}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`);document.getElementById('searchEx').addEventListener('input',e=>document.querySelectorAll('#options button').forEach(b=>b.style.display=b.dataset.name.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'))}if(el.dataset.choose!==undefined){const i=+el.dataset.choose;const old=state.draft.exercises[i];if(old.sets.some(s=>s.done)&&!confirm('Замінити вправу та її поточні сети?'))return;state.draft.exercises[i]=makeEx(el.dataset.name);save();close();render()}if(el.dataset.detail!==undefined){const h=state.history[+el.dataset.detail];dialog(`<h2>${esc(h.date)} · Full Body ${esc(h.type)}</h2><div class="preview">${esc(report(h))}</div>`)}if(el.id==='closeModal')close();if(el.id==='backup'||el.id==='exportBackup')download('lean-bulk-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(el.id==='resetDraft'&&confirm('Видалити поточну чернетку? Історія залишиться.'))start(state.draft.type);if(el.id==='finish'){const d=state.draft;
const currentDate=today();
if(d.date!==currentDate){
  const useToday=confirm('Дата чернетки: '+d.date+'\\nСьогодні: '+currentDate+'\\n\\nНатисни OK, щоб записати тренування сьогодні.\\nСкасувати — залишити стару дату (для тренування за минулий день).');
  if(useToday){d.date=currentDate;save();render()}
}
if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d.date)){alert('Некоректна дата тренування.');return}
const incomplete=d.exercises.flatMap(e=>e.sets).filter(s=>!s.warm&&!s.done);if(incomplete.length&&!confirm(`${incomplete.length} робочих сетів не позначені виконаними. Завершити лише з відміченими сетами?`))return;const textReport=report(d);dialog(`<h2>Звіт тренування</h2><p class="notice">Перевір звіт. Натисни «Копіювати» і надішли його в ChatGPT. Збереження в Google Sheets — тільки після твого підтвердження.</p><div class="preview" id="reportText">${esc(textReport)}</div><div class="tools"><button class="btn" id="copyReport">Копіювати звіт</button><button class="btn2" id="archiveWorkout">Зберегти в історію й почати наступне</button></div>`)}if(el.id==='copyReport'){const str=document.getElementById('reportText').textContent;try{await navigator.clipboard.writeText(str);alert('Звіт скопійовано')}catch(e){download('lean-bulk-report-'+state.draft.date+'.txt',str,'text/plain');alert('Звіт збережено як текстовий файл')}}if(el.id==='archiveWorkout'){const d=structuredClone(state.draft);d.exercises=d.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>{delete s.done;return s})})).filter(e=>e.sets.length);if(state.history.some(h=>h.date===d.date&&h.type===d.type)){if(!confirm('Уже є тренування з цією датою й типом. Замінити його?'))return;state.history=state.history.filter(h=>!(h.date===d.date&&h.type===d.type))}state.history.push(d);state.history.sort((a,b)=>a.date.localeCompare(b.date));const next={A:'B',B:'C',C:'A'}[d.type];state.draft={date:today(),type:next,exercises:programs[next].map(makeEx)};save();close();render();alert('Тренування збережено в локальній історії. Звіт потрібно окремо надіслати в ChatGPT.')}});document.addEventListener('click',e=>{const toggle=e.target.closest('[data-map-mode]');if(toggle){window.muscleMode=toggle.dataset.mapMode;renderAnalytics();return}const region=e.target.closest('[data-muscle]');if(region){const info=document.getElementById('muscleInfo');if(info)info.innerHTML=muscleInfo(region.dataset.muscle,['today','two','four','six'].includes(window.muscleMode)?window.muscleMode:'six');document.querySelectorAll('.muscle-region').forEach(p=>p.classList.toggle('muscle-selected',p.dataset.muscle===region.dataset.muscle))}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-muscle]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('click',e=>{const thumb=e.target.closest('[data-image]');if(thumb)viewArt(Number(thumb.dataset.image))});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script>
/* Measurements v1.6.5: stored in the existing backup state, no external services. */
(function(){
 const fields=[['weight','Вага','кг'],['neck','Шия','см'],['shoulders','Плечі (обхват)','см'],['chest','Груди','см'],['waist','Талія','см'],['navel','Живіт (на рівні пупка)','см'],['hips','Стегна / таз','см'],['biceps','Біцепс','см'],['forearm','Передпліччя','см'],['thigh','Стегно','см'],['calf','Литка','см']];
 if(!Array.isArray(state.measurements))state.measurements=[];
 // Older versions stored left/right separately. Preserve both originals and
 // populate a single combined measurement for the simplified form.
 let measurementMigrated=false;
 for(const rec of state.measurements){
  for(const base of ['biceps','forearm','thigh','calf']){
   if(rec[base]!==undefined && rec[base]!=='' && rec[base]!==null)continue;
   const nums=[rec[base+'L'],rec[base+'R']].filter(v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))).map(Number);
   if(nums.length){rec[base]=Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*10)/10;measurementMigrated=true;}
  }
 }
 if(measurementMigrated)save();
 const el=document.getElementById('measurements');
 let editDate=null;

 function sticker(k){
  const group=k.replace(/(L|R)$/,""), key=STICKER_IMAGES[k]?k:group;
  return `<span class="measure-sticker" role="button" tabindex="0" data-measure-help="${k}" aria-label="Показати як вимірювати: ${fields.find(f=>f[0]===k)[1]}"><img src="${STICKER_IMAGES[key]||STICKER_IMAGES.weight}" alt="" loading="lazy"></span>`;
 }
 const opts=fields.map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
 function draw(){
  const a=[...state.measurements].sort((x,y)=>x.date.localeCompare(y.date));
  const last=a.at(-1),prev=a.at(-2);
  const select=document.getElementById('measureMetric');
  const metric=select?.value||'weight';
  const points=a.filter(r=>r[metric]!==''&&Number.isFinite(+r[metric])).map(r=>({date:r.date,v:+r[metric]}));
  let graph='<p class="muted">Для графіка потрібно щонайменше два записи.</p>';
  if(points.length>1){
   const vs=points.map(p=>p.v),min=Math.min(...vs),max=Math.max(...vs),pad=Math.max((max-min)*.2,.5),lo=min-pad,hi=max+pad;
   const xy=points.map((p,i)=>[35+i*300/(points.length-1),150-(p.v-lo)*115/(hi-lo)]);
   graph=`<svg class="measure-chart" viewBox="0 0 370 190" role="img" aria-label="Графік замірів"><line x1="35" y1="18" x2="35" y2="155" stroke="#66707d"/><line x1="35" y1="155" x2="340" y2="155" stroke="#66707d"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff922e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff922e"><title>${points[i].date}: ${points[i].v}</title></circle>`).join('')}<text x="36" y="15" fill="#aab0ba" font-size="12">${fnum(max)}</text><text x="36" y="175" fill="#aab0ba" font-size="11">${points[0].date.slice(5)}</text><text x="300" y="175" fill="#aab0ba" font-size="11">${points.at(-1).date.slice(5)}</text></svg>`;
  }
  const latest=last?['weight','chest','waist','hips'].map(k=>{const f=fields.find(x=>x[0]===k);const d=prev&&last[k]!==''&&prev[k]!==''?+last[k]-+prev[k]:null;return `<div><small>${f[1]}</small><strong>${last[k]!==''?fnum(last[k]):'—'} ${last[k]!==''?f[2]:''}</strong><small>${d===null?'':(d>0?'+':'')+fnum(d)+' від попереднього'}</small></div>`}).join(''):'';
  el.innerHTML=`<h2>📏 Заміри тіла</h2><p class="notice">Записуй вимірювання в однакових умовах, бажано вранці. Для рук і ніг щоразу вимірюй ту саму сторону. Усі значення зберігаються на цьому пристрої та потрапляють у резервну копію JSON.</p>
  ${last?`<div class="card"><div class="row"><strong>Останній запис</strong><span class="muted">${last.date}</span></div><div class="measure-summary" style="margin-top:12px">${latest}</div></div>`:''}
  <div class="card"><strong>Новий запис / редагування</strong><form id="measureForm"><label class="measure-field" style="margin:12px 0">Дата<input id="measureDate" type="date" required value="${editDate||today()}"></label><div id="measureHelp" class="measure-hint" style="display:none"></div><div class="measure-grid">${fields.map(([k,n,u])=>`<label class="measure-field"><span class="measure-label">${sticker(k)}<span class="measure-label-text">${n} (${u})</span></span><input name="${k}" inputmode="decimal" type="number" min="0" max="500" step="0.1" placeholder="—"></label>`).join('')}</div><p class="muted">Порожні поля залишаються незаповненими. Запис із тією самою датою буде оновлено.</p><button type="submit" class="btn" style="width:100%">💾 Зберегти заміри</button></form></div>
  <div class="card"><strong>📈 Динаміка замірів</strong><select id="measureMetric" style="margin:12px 0;width:100%">${opts}</select><div id="measureGraph">${graph}</div></div>
  <div class="card"><strong>Історія замірів (${a.length})</strong>${a.length?a.slice().reverse().map(r=>`<div class="measure-row"><div class="row"><strong>${r.date}</strong><span><button class="btn2 small" data-edit-measure="${r.date}">Змінити</button> <button class="btn2 small btnDanger" data-delete-measure="${r.date}">×</button></span></div><div class="muted">${fields.filter(([k])=>r[k]!==''&&r[k]!==undefined).map(([k,n,u])=>`${n}: ${fnum(r[k])} ${u}`).join(' · ')}</div></div>`).join(''):'<p class="muted">Поки що записів немає.</p>'}</div>`;
  document.getElementById('measureMetric').value=metric;
  const record=state.measurements.find(r=>r.date===(editDate||today()));
  if(record)for(const [k] of fields){const inp=el.querySelector(`[name="${k}"]`);if(inp&&record[k]!==undefined)inp.value=record[k]}
 }
 function graphOnly(){const metric=document.getElementById('measureMetric')?.value;if(!metric)return;const a=[...state.measurements].sort((x,y)=>x.date.localeCompare(y.date));const pts=a.filter(r=>r[metric]!==''&&Number.isFinite(+r[metric])).map(r=>({date:r.date,v:+r[metric]}));const box=document.getElementById('measureGraph');if(!box)return;if(pts.length<2){box.innerHTML='<p class="muted">Для графіка потрібно щонайменше два записи.</p>';return}const min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v)),pad=Math.max((max-min)*.2,.5),lo=min-pad,hi=max+pad;const xy=pts.map((p,i)=>[35+i*300/(pts.length-1),150-(p.v-lo)*115/(hi-lo)]);box.innerHTML=`<svg class="measure-chart" viewBox="0 0 370 190"><line x1="35" y1="155" x2="340" y2="155" stroke="#66707d"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff922e" stroke-width="3"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff922e"><title>${p.date}: ${p.v}</title></circle>`).join('')}<text x="35" y="175" fill="#aab0ba" font-size="11">${pts[0].date.slice(5)}</text><text x="295" y="175" fill="#aab0ba" font-size="11">${pts.at(-1).date.slice(5)}</text></svg>`}
 el.addEventListener('submit',e=>{if(e.target.id!=='measureForm')return;e.preventDefault();const form=e.target,date=form.querySelector('#measureDate').value;if(!date)return;const rec={date};let count=0;for(const [k] of fields){const raw=form.elements[k].value.trim();rec[k]=raw===''?'':Number(raw);if(raw!=='')count++}if(!count){alert('Вкажи хоча б один замір.');return}state.measurements=state.measurements.filter(x=>x.date!==date);state.measurements.push(rec);state.measurements.sort((a,b)=>a.date.localeCompare(b.date));save();editDate=date;draw();alert('Заміри збережено ✓')});
 el.addEventListener('change',e=>{if(e.target.id==='measureMetric')graphOnly();if(e.target.id==='measureDate'){const r=state.measurements.find(x=>x.date===e.target.value);if(r){for(const [k] of fields)el.querySelector(`[name="${k}"]`).value=r[k]??''}}});
 el.addEventListener('click',e=>{const help=e.target.closest('[data-measure-help]');if(help){e.preventDefault();const k=help.dataset.measureHelp;const box=el.querySelector('#measureHelp');box.style.display='block';box.innerHTML='<button type=\"button\" data-close-help>×</button><strong>'+fields.find(f=>f[0]===k)[1]+'</strong><p>'+hintText[k]+'</p>';return}if(e.target.closest('[data-close-help]')){el.querySelector('#measureHelp').style.display='none';return}});
 el.addEventListener('keydown',e=>{const b=e.target.closest('[data-measure-help]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click()}});
 el.addEventListener('click',e=>{const edit=e.target.closest('[data-edit-measure]'),del=e.target.closest('[data-delete-measure]');if(edit){editDate=edit.dataset.editMeasure;draw();el.scrollIntoView({behavior:'smooth',block:'start'})}if(del&&confirm('Видалити заміри за '+del.dataset.deleteMeasure+'?')){state.measurements=state.measurements.filter(r=>r.date!==del.dataset.deleteMeasure);save();editDate=null;draw()}});

<script>
/* v1.6.5: manual, opt-in Apps Script sync; no secrets embedded in source. */
(()=>{
 const U='leanbulk_sync_url_v1',T='leanbulk_sync_token_v1';
 const status=t=>{const e=document.getElementById('syncStatus');if(e)e.textContent=t};
 const urlEl=()=>document.getElementById('syncUrl'),tokenEl=()=>document.getElementById('syncToken');
 function populate(){if(!urlEl())return;urlEl().value=localStorage.getItem(U)||'';tokenEl().value=localStorage.getItem(T)||''}
 document.querySelector('[data-tab="settings"]').addEventListener('click',()=>setTimeout(populate,0));
 document.addEventListener('click',async e=>{
  const id=e.target?.id;
  if(!['syncSave','syncSend','syncClear'].includes(id))return;
  if(id==='syncClear'){if(!confirm('Видалити збережений токен з цього браузера?'))return;localStorage.removeItem(T);if(tokenEl())tokenEl().value='';status('Токен видалено.');return}
  const url=(urlEl()?.value||'').trim(),token=(tokenEl()?.value||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){status('Перевір адресу Apps Script: потрібен повний HTTPS URL із /exec.');return}
  if(!token){status('Спочатку введи секретний токен із Script Properties.');return}
  try{localStorage.setItem(U,url);localStorage.setItem(T,token)}catch(err){status('Не вдалося зберегти налаштування у браузері.');return}
  if(id==='syncSave'){status('Налаштування збережені тільки в цьому браузері.');return}
  const workouts=(state.history||[]).map(h=>({id:'workout-'+h.date+'-'+h.type,date:h.date,type:h.type,exercises:h.exercises}));
  const measurements=(state.measurements||[]).map(r=>({...r,id:'measurement-'+r.date}));
  if(!workouts.length&&!measurements.length){status('Немає завершених тренувань або замірів для надсилання.');return}
  if(!confirm(`Надіслати ${workouts.length} тренувань і ${measurements.length} записів замірів до Google Sheets?`))return;
  const btn=e.target;btn.disabled=true;status('Надсилаю дані…');
  try{
   for(const [kind,items] of [['workouts',workouts],['measurements',measurements]]){
    if(!items.length)continue;
    for(let i=0;i<items.length;i+=100){
     const body=JSON.stringify({token,action:'upsert',kind,items:items.slice(i,i+100)});
     await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    }
   }
   status('Запити надіслано. Через обмеження CORS підтвердження від сервера немає. Перевір вкладки «Тренування» та «LB_Синхронізація_тренувань» у Google Sheets. Локальні дані збережені.');
  }catch(err){status('Помилка відправлення: '+String(err.message||err)+'. Локальні дані не змінено.')}finally{btn.disabled=false}
 });
})();
</script>
<script>
/* v1.7.3: explicit one-workout local save and opt-in Google Sheets upload. */
(()=>{
 const button=document.getElementById('saveSyncWorkout');
 if(!button)return;
 button.addEventListener('click',async()=>{
  const draft=state.draft;
  if(!draft||!draft.date||!draft.type){alert('Немає активного тренування.');return}
  const workout=structuredClone(draft);
  workout.exercises=workout.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done===true).map(s=>{const copy={...s};delete copy.done;return copy})})).filter(e=>e.sets.some(s=>!s.warm));
  const n=workout.exercises.reduce((total,e)=>total+e.sets.filter(s=>!s.warm).length,0);
  if(!n){alert('Спочатку познач виконані робочі підходи.');return}
  const url=(localStorage.getItem('leanbulk_sync_url_v1')||'').trim();
  const token=(localStorage.getItem('leanbulk_sync_token_v1')||'').trim();
  const ready=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)&&!!token;
  if(!ready){alert('Спочатку налаштуй URL Apps Script і токен у вкладці «Дані». Поточне тренування не змінено.');return}
  const existing=state.history.some(h=>h.date===workout.date&&h.type===workout.type);
  if(!confirm(`Зберегти Full Body ${workout.type} за ${workout.date} (${n} робочих підходів) у локальній історії${existing?' замість наявного запису':''} та надіслати до Google Sheets?\n\nЧернетка залишиться відкритою. Підтвердження запису потрібно перевірити в таблиці.`))return;
  button.disabled=true;const old=button.textContent;button.textContent='☁️ Надсилання…';
  try{
   state.history=state.history.filter(h=>!(h.date===workout.date&&h.type===workout.type));
   state.history.push(workout);state.history.sort((a,b)=>a.date.localeCompare(b.date));save();
   const item={id:'workout-'+workout.date+'-'+workout.type,date:workout.date,type:workout.type,exercises:workout.exercises};
   await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,action:'upsert',kind:'workouts',items:[item]})});
   alert('Тренування збережено в локальній історії, запит надіслано. Через обмеження браузера підтвердження запису немає. Перевір Google Таблицю, зокрема вкладку синхронізації. Чернетку не очищено.');
  }catch(err){alert('Тренування збережено локально, але надсилання могло не відбутися: '+String(err.message||err)+'. Чернетку не очищено.')}finally{button.disabled=false;button.textContent=old}
 });
})();
</script>
