:root{font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif;color:#f4f5f7;background:#101216;font-size:15px}*{box-sizing:border-box}body{margin:0;padding-bottom:100px}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:680px;margin:auto;padding:20px 15px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}.brand{font-weight:900;letter-spacing:2px;color:#ff922e;font-size:25px}.sub,.muted{color:#aab0ba;font-size:12px}.card{background:#20242b;border:1px solid #353b44;border-radius:17px;padding:15px;margin:12px 0}.title{font-weight:800;font-size:19px}.orange{color:#ff922e}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{background:#f08220;color:#101216;border-radius:11px;padding:12px 14px;font-weight:800}.btn2{background:#333942;color:#fff;border-radius:10px;padding:10px 12px}.btnDanger{background:#532c2c;color:#ffd4d4}.small{font-size:12px;padding:8px 10px}.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:4;background:#101216;padding:10px 0}.tab{flex:1;padding:11px 3px;border-radius:10px;background:#272c33;color:#bbc2cc;font-weight:700}.tab.active{background:#f08220;color:#121212}.exercise{border-top:1px solid #343a42;margin-top:12px;padding-top:12px}.exhead{display:flex;gap:12px;align-items:center}.thumb{width:88px;height:88px;border-radius:12px;background:linear-gradient(135deg,#353b43,#17191d);display:grid;place-items:center;overflow:hidden;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:contain}.thumb svg{width:62px;height:62px}.gridhead,.setrow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 78px 28px;gap:6px;align-items:center;margin:8px 0}.gridhead{color:#aeb5c0;font-size:11px;text-align:center}.setrow input,.setrow select,input[type=date],input[type=text],select{background:#14171c;border:1px solid #414953;border-radius:8px;color:#fff;padding:9px 5px;width:100%;min-width:0;text-align:center}.setrow input:focus{outline:2px solid #ff922e}.setrow .kind{font-size:11px;color:#ffad59;text-align:center}.setrow .remove{background:none;color:#d5a3a3;font-size:22px}.chip{display:inline-block;background:#363d45;padding:5px 8px;border-radius:7px;color:#cdd1d8;font-size:11px}.historyline{font-size:12px;color:#b5bbc5;margin-top:6px;line-height:1.6}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#242931;border-radius:12px;padding:13px 8px;text-align:center}.stat strong{display:block;font-size:21px;color:#ff922e}.stat span{font-size:11px;color:#aeb5c0}.notice{font-size:12px;color:#b3bbc5;line-height:1.5}.hidden{display:none}.foot{position:fixed;bottom:0;left:0;right:0;background:#101216ed;border-top:1px solid #353b44;padding:12px max(14px,calc((100vw - 650px)/2));display:flex;gap:8px;z-index:5}.foot button{flex:1}.modal{position:fixed;inset:0;background:#000c;z-index:9;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:min(100%,530px);max-height:85vh;overflow:auto;background:#252a31;border-radius:18px;padding:18px}.option{display:block;width:100%;background:#333942;color:#fff;text-align:left;border-radius:9px;padding:12px;margin:7px 0}.preview{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#12151a;padding:12px;border-radius:10px;max-height:45vh;overflow:auto}.filelabel{display:inline-block;cursor:pointer}.topline{display:flex;align-items:center;gap:8px;margin:10px 0}.topline input{max-width:170px}.banner{padding:9px 12px;border-radius:9px;background:#253a30;color:#a5e0b4;font-size:12px}a{color:#ffab5b}@media(max-width:390px){.shell{padding:12px 9px}.gridhead,.setrow{grid-template-columns:29px minmax(0,1fr) minmax(0,1fr) 67px 23px;gap:4px}.setrow input,.setrow select{padding:8px 2px}.thumb{width:70px;height:70px}}
</style></head><body><main class="shell"><header class="head"><div><div class="brand">LEAN BULK</div><div class="sub">WORKOUT TRACKER · A → B → C</div></div><div style="font-size:30px">🏋️</div></header><div class="tabs"><button class="tab active" data-tab="train">Тренування</button><button class="tab" data-tab="history">Історія</button><button class="tab" data-tab="settings">Дані</button></div><section id="train"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><div class="foot" id="footer"><button class="btn2" id="backup">⬇ Резервна копія</button><button class="btn" id="finish">Завершити · Звіт</button></div><div id="modalroot"></div><script>
const KEY='leanbulk_v1';const programs={A:['Abdominal Crunch Machine','Leg Press','Incline DB Press','Arm Curl','Lat Pulldown'],B:['Hanging Leg Raises','Romanian Deadlift','Seated Dip','Low Row','Arm Curl'],C:['Abdominal Crunch Machine','Hip Thrust','Pec Fly','Triceps Pushdown','Low Row']};const catalog=['Abdominal Crunch Machine','Hanging Leg Raises','Leg Press','Incline DB Press','Arm Curl','Lat Pulldown','Romanian Deadlift','Seated Dip','Low Row','Hip Thrust','Pec Fly','Triceps Pushdown','Rear Delt Fly','Lateral Raise','Standing Cable Pullover','Cable Fly','Dumbbell Bench Press','Leg Extension','Leg Curl','Cable Row','Pull Ups','Dumbbell Curl','Triceps Overhead Extension'];const groups={'Abdominal Crunch Machine':'Прес','Hanging Leg Raises':'Прес','Leg Press':'Ноги','Incline DB Press':'Груди','Arm Curl':'Біцепс','Lat Pulldown':'Спина','Romanian Deadlift':'Ноги · задня поверхня','Seated Dip':'Трицепс','Low Row':'Спина','Hip Thrust':'Сідниці','Pec Fly':'Груди','Triceps Pushdown':'Трицепс','Rear Delt Fly':'Задня дельта','Lateral Raise':'Плечі','Standing Cable Pullover':'Спина'};const initialHistory=[{date:'2026-10-29',type:'A',exercises:[{name:'Abdominal Crunch Machine',sets:[[45,15,'🟠',1],[54,15,'🟠'],[54,15,'🟠']]},{name:'Leg Press',sets:[[107,15,'🟡',1],[134,12,'🟠'],[134,12,'🟠'],[134,12,'🟠']]},{name:'Incline DB Press',sets:[[23,15,'🟡',1],[33,15,'🟠'],[33,15,'🟠'],[33,11,'🔴']]},{name:'Lat Pulldown',sets:[[52,12,'🟡',1],[59,10,'🔴'],[52,12,'🟠'],[59,10,'']]},{name:'Lateral Raise',sets:[[12,12,'🟠',1],[14,15,'🟠'],[14,15,'🟠'],[16,10,'🔴']]}]},{date:'2026-11-03',type:'C',exercises:[{name:'Abdominal Crunch Machine',sets:[[41,15,'🟡'],[59,15,'🟠'],[59,15,'🟠'],[59,15,'🔴']]},{name:'Hip Thrust',sets:[[32,12,'🟡',1],[52,12,'🟡'],[62,12,'🟠'],[62,12,'🟠']]},{name:'Pec Fly',sets:[[66,12,'🟡',1],[93,15,'🟡'],[93,15,'🟠'],[100,12,'🔴']]},{name:'Triceps Pushdown',sets:[[18,12,'🟡',1],[23,12,'🟠'],[23,12,'🟠'],[23,12,'🟠']]},{name:'Low Row',sets:[[52,12,'🟡',1],[79,12,'🟡'],[79,12,'🟠'],[79,12,'🟠']]}]}];function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}const cleanSet=(s)=>({kg:s[0],reps:s[1],rpe:s[2],warm:!!s[3]});const seed={version:1,history:initialHistory.map(h=>({...h,exercises:h.exercises.map(e=>({...e,sets:e.sets.map(cleanSet)}))})),draft:null,images:{}};let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed;if(!state.history||!state.images)throw Error('schema')}catch(e){state=structuredClone(seed)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelectorAll('.saved').forEach(x=>x.textContent='✓ Збережено на пристрої')}catch(e){alert('Не вдалося зберегти локально. Експортуй резервну копію; перевір вільне місце і режим браузера.')}}function last(name,before){return [...state.history].filter(h=>!before||h.date<before).reverse().flatMap(h=>h.exercises.map(e=>({...e,date:h.date}))).find(e=>e.name===name)}function makeEx(name){const prev=last(name);return {name,sets:prev?prev.sets.map(s=>({...s,rpe:'',done:false})): [{kg:'',reps:12,rpe:'',warm:true,done:false},{kg:'',reps:12,rpe:'',warm:false,done:false},{kg:'',reps:12,rpe:'',warm:false,done:false},{kg:'',reps:12,rpe:'',warm:false,done:false}]}}function start(type){state.draft={date:today(),type,exercises:programs[type].map(makeEx)};save();render()}if(!state.draft)start('A');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function diagram(name){const n=esc(name);return `<svg viewBox="0 0 100 100" role="img" aria-label="Схематична піктограма ${n}"><circle cx="50" cy="17" r="10" fill="#ff922e"/><path d="M50 29L50 59M50 36L27 48M50 36L73 48M50 59L34 83M50 59L66 83" stroke="#ff922e" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M16 46h15m38 0h15" stroke="#b5bdc9" stroke-width="6" stroke-linecap="round"/></svg>`}function totals(d){let sets=0,reps=0,volume=0;for(const e of d.exercises)for(const s of e.sets){if(s.warm||s.done===false)continue;const r=Number(s.reps)||0;sets++;reps+=r;volume+=(Number(s.kg)||0)*r*(e.name==='Incline DB Press'||e.name==='Lateral Raise'?2:1)}return {sets,reps,volume}}function setHtml(e,ei){let prev=last(e.name,state.draft.date);return `<div class="card exercise"><div class="exhead"><div class="thumb" data-image="${ei}">${state.images[e.name]?`<img src="${state.images[e.name]}" alt="${esc(e.name)}">`:diagram(e.name)}</div><div style="flex:1"><div class="title">${esc(e.name)}</div><div class="muted">${esc(groups[e.name]||'Силова вправа')}</div><div class="historyline">${prev?`Минулого разу ${prev.date}: ${prev.sets.filter(s=>!s.warm).map(s=>`${s.kg}×${s.reps}`).join(' · ')}`:'Немає попереднього запису'}</div></div></div><div class="tools"><button class="btn2 small" data-change="${ei}">⇄ Замінити</button><label class="btn2 small filelabel">▧ Додати ілюстрацію<input type="file" accept="image/*" data-upload="${ei}" style="display:none"></label></div><div class="gridhead"><span>Тип</span><span>Вага, кг</span><span>Повт.</span><span>RPE</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="setrow"><button class="btn2 small kind" data-warm="${ei}:${si}" title="Перемкнути розминку/робочий">${s.warm?'Р':'${si+1}'}</button><input inputmode="decimal" type="number" step="0.5" min="0" data-set="${ei}:${si}:kg" value="${esc(s.kg)}"><input inputmode="numeric" type="number" min="0" data-set="${ei}:${si}:reps" value="${esc(s.reps)}"><select data-set="${ei}:${si}:rpe"><option value="">—</option>${['🟢','🟡','🟠','🔴'].map(r=>`<option ${s.rpe===r?'selected':''}>${r}</option>`).join('')}</select><input type="checkbox" data-set="${ei}:${si}:done" ${s.done?'checked':''} style="accent-color:#ff922e;width:22px;height:22px"></div>`).join('')}<div class="tools"><button class="btn2 small" data-add="${ei}">+ Підхід</button><button class="btn2 small" data-remove="${ei}">− Останній</button></div></div>`}function render(){const d=state.draft,t=totals(d);document.getElementById('train').innerHTML=`<div class="banner saved">✓ Збережено на пристрої</div><div class="topline"><span class="muted">Дата</span><input type="date" id="date" value="${esc(d.date)}"><span class="muted">Програма</span><select id="program">${['A','B','C'].map(x=>`<option value="${x}" ${d.type===x?'selected':''}>Full Body ${x}</option>`).join('')}</select></div><div class="stats"><div class="stat"><strong>${t.sets}</strong><span>Виконані сети</span></div><div class="stat"><strong>${t.reps}</strong><span>Повторення</span></div><div class="stat"><strong>${t.volume.toLocaleString('uk-UA')}</strong><span>Тоннаж, кг</span></div></div><p class="notice">Попередні ваги підставляються як план. Познач ✓ після фактичного виконання. Р = розминка. Для гантелей тоннаж рахується за дві руки.</p>${d.exercises.map(setHtml).join('')}`;document.getElementById('history').innerHTML=`<h2>Історія тренувань</h2>${[...state.history].reverse().map((h,i)=>`<div class="card"><div class="row"><strong>${esc(h.date)} · Full Body ${esc(h.type)}</strong><button class="btn2 small" data-detail="${state.history.length-1-i}">Деталі</button></div><div class="muted">${h.exercises.length} вправ · ${h.exercises.reduce((a,e)=>a+e.sets.filter(s=>!s.warm).length,0)} робочих підходів</div></div>`).join('')}`;document.getElementById('settings').innerHTML=`<h2>Збереження й перенесення</h2><div class="card"><strong>Локальне збереження</strong><p class="notice">Дані зберігаються у сховищі браузера на цьому пристрої. Якщо очистити дані Safari, відкрити інший домен або змінити пристрій, вони не синхронізуються автоматично. Регулярно роби резервну копію JSON.</p><button class="btn" id="exportBackup">Експортувати JSON</button><label class="btn2 filelabel" style="margin-left:8px">Імпортувати JSON<input type="file" id="importBackup" accept="application/json,.json" hidden></label></div><div class="card"><strong>Ілюстрації</strong><p class="notice">Натисни «Додати ілюстрацію» біля вправи й обери наш оригінальний малюнок з Фото/Файлів. Ілюстрація зберігається локально. Зараз замість відсутніх ілюстрацій показані схематичні піктограми, а не точна техніка вправ.</p></div><div class="card"><strong>Звіт для ChatGPT</strong><p class="notice">Кнопка завершення створює текстовий звіт, який можна скопіювати й надіслати в наш чат. Google Sheets не змінюється без твого окремого підтвердження.</p></div><button class="btn2 btnDanger" id="resetDraft">Почати нову чернетку (з підтвердженням)</button>`}function dialog(html){document.getElementById('modalroot').innerHTML=`<div class="modal"><div class="dialog">${html}<div style="margin-top:12px"><button class="btn2" id="closeModal">Закрити</button></div></div></div>`}function close(){document.getElementById('modalroot').innerHTML=''}function report(d){let out=`Lean Bulk — Full Body ${d.type}\nДата: ${d.date}\n`;for(const e of d.exercises){out+=`\n${e.name}\n`;e.sets.forEach((s,i)=>{if(s.done!==false)out+=`  ${s.warm?'Розминка':'Робочий'} ${i+1}: ${s.kg||'власна вага'} кг × ${s.reps} ${s.rpe||'RPE не вказано'}\n`})}const t=totals(d);return out+`\nПІДСУМКИ: ${t.sets} робочих сетів; ${t.reps} повторень; ${t.volume} кг тоннажу (без розминок; гантелі ×2).\nПрошу перевірити результати. НЕ записуй у Google Sheets без мого окремого підтвердження.`}function download(filename,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset.set)return;const [ei,si,k]=el.dataset.set.split(':');const s=state.draft.exercises[+ei].sets[+si];s[k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save()});document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.set){const [ei,si,k]=el.dataset.set.split(':');state.draft.exercises[+ei].sets[+si][k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();if(k==='done')render();return}if(el.id==='date'){state.draft.date=el.value;save();render()}if(el.id==='program'){if(confirm('Перемкнути програму? Поточна чернетка буде замінена. Спочатку зроби резервну копію, якщо вона потрібна.'))start(el.value);else render()}if(el.dataset.upload!==undefined){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Вибери зображення до 1,5 МБ, щоб не переповнити локальне сховище.');return}const name=state.draft.exercises[+el.dataset.upload].name;const reader=new FileReader();reader.onload=()=>{state.images[name]=reader.result;save();render()};reader.readAsDataURL(f)}if(el.id==='importBackup'){const f=el.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.history)||!x.draft||typeof x.images!=='object')throw Error();if(confirm('Замінити всі локальні дані резервною копією?')){state=x;save();render()}}catch(e){alert('Неправильний файл резервної копії')}};reader.readAsText(f)}});document.addEventListener('click',async ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===el));for(const t of ['train','history','settings'])document.getElementById(t).classList.toggle('hidden',t!==el.dataset.tab);document.getElementById('footer').style.display=el.dataset.tab==='train'?'flex':'none'}if(el.dataset.add!==undefined){let e=state.draft.exercises[+el.dataset.add],p=e.sets[e.sets.length-1];e.sets.push({...p,rpe:'',done:false});save();render()}if(el.dataset.remove!==undefined){let e=state.draft.exercises[+el.dataset.remove];if(e.sets.length>1&&confirm('Видалити останній підхід?')){e.sets.pop();save();render()}}if(el.dataset.warm){let [i,j]=el.dataset.warm.split(':').map(Number);state.draft.exercises[i].sets[j].warm=!state.draft.exercises[i].sets[j].warm;save();render()}if(el.dataset.change!==undefined){const i=+el.dataset.change;dialog(`<h2>Замінити вправу</h2><input id="searchEx" type="text" placeholder="Пошук вправи" style="text-align:left"><div id="options">${catalog.map(n=>`<button class="option" data-choose="${i}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`);document.getElementById('searchEx').addEventListener('input',e=>document.querySelectorAll('#options button').forEach(b=>b.style.display=b.dataset.name.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'))}if(el.dataset.choose!==undefined){const i=+el.dataset.choose;const old=state.draft.exercises[i];if(old.sets.some(s=>s.done)&&!confirm('Замінити вправу та її поточні сети?'))return;state.draft.exercises[i]=makeEx(el.dataset.name);save();close();render()}if(el.dataset.detail!==undefined){const h=state.history[+el.dataset.detail];dialog(`<h2>${esc(h.date)} · Full Body ${esc(h.type)}</h2><div class="preview">${esc(report(h))}</div>`)}if(el.id==='closeModal')close();if(el.id==='backup'||el.id==='exportBackup')download('lean-bulk-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(el.id==='resetDraft'&&confirm('Видалити поточну чернетку? Історія залишиться.'))start(state.draft.type);if(el.id==='finish'){const d=state.draft;const incomplete=d.exercises.flatMap(e=>e.sets).filter(s=>!s.warm&&!s.done);if(incomplete.length&&!confirm(`${incomplete.length} робочих сетів не позначені виконаними. Завершити лише з відміченими сетами?`))return;const textReport=report(d);dialog(`<h2>Звіт тренування</h2><p class="notice">Перевір звіт. Натисни «Копіювати» і надішли його в ChatGPT. Збереження в Google Sheets — тільки після твого підтвердження.</p><div class="preview" id="reportText">${esc(textReport)}</div><div class="tools"><button class="btn" id="copyReport">Копіювати звіт</button><button class="btn2" id="archiveWorkout">Зберегти в історію й почати наступне</button></div>`)}if(el.id==='copyReport'){const str=document.getElementById('reportText').textContent;try{await navigator.clipboard.writeText(str);alert('Звіт скопійовано')}catch(e){download('lean-bulk-report-'+state.draft.date+'.txt',str,'text/plain');alert('Звіт збережено як текстовий файл')}}if(el.id==='archiveWorkout'){const d=structuredClone(state.draft);d.exercises=d.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>{delete s.done;return s})})).filter(e=>e.sets.length);if(state.history.some(h=>h.date===d.date&&h.type===d.type)){if(!confirm('Уже є тренування з цією датою й типом. Замінити його?'))return;state.history=state.history.filter(h=>!(h.date===d.date&&h.type===d.type))}state.history.push(d);state.history.sort((a,b)=>a.date.localeCompare(b.date));const next={A:'B',B:'C',C:'A'}[d.type];state.draft={date:today(),type:next,exercises:programs[next].map(makeEx)};save();close();render();alert('Тренування збережено в локальній історії. Звіт потрібно окремо надіслати в ChatGPT.')}});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
