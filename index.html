`;updateLive();renderAnalytics();document.getElementById('settings').innerHTML=`<h2>Збереження й перенесення</h2><div class="card"><strong>Локальне збереження</strong><p class="notice">Дані зберігаються у сховищі браузера на цьому пристрої. Якщо очистити дані Safari, відкрити інший домен або змінити пристрій, вони не синхронізуються автоматично. Регулярно роби резервну копію JSON.</p><button class="btn" id="exportBackup">Експортувати JSON</button><label class="btn2 filelabel" style="margin-left:8px">Імпортувати JSON<input type="file" id="importBackup" accept="application/json,.json" hidden></label></div><div class="card"><strong>Ілюстрації</strong><p class="notice">Натисни «Додати ілюстрацію» біля вправи й обери наш оригінальний малюнок з Фото/Файлів. Ілюстрація зберігається локально. Якщо файли з папки illustrations відсутні, показані схематичні піктограми, а не точна техніка вправ.</p></div><div class="card"><strong>Звіт для ChatGPT</strong><p class="notice">Кнопка завершення створює текстовий звіт, який можна скопіювати й надіслати в наш чат. Google Sheets не змінюється без твого окремого підтвердження.</p></div><button class="btn2 btnDanger" id="resetDraft">Почати нову чернетку (з підтвердженням)</button>`}function dialog(html){document.getElementById('modalroot').innerHTML=`<div class="modal"><div class="dialog">${html}<div style="margin-top:12px"><button class="btn2" id="closeModal">Закрити</button></div></div></div>`}function viewArt(ei){const e=state.draft.exercises[ei];if(!e)return;const path=state.images[e.name]||builtInArt[e.name];if(!path)return;dialog(`<h3>${esc(e.name)}</h3><img src="${path}" alt="${esc(e.name)}" style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:#12151b"><p class="muted">Ілюстрація для орієнтації, не замінює інструктаж тренера.</p>`)}
function close(){document.getElementById('modalroot').innerHTML=''}function report(d){let out=`Lean Bulk — Full Body ${d.type}\nДата: ${d.date}\n`;for(const e of d.exercises){out+=`\n${e.name}\n`;e.sets.forEach((s,i)=>{if(s.done!==false)out+=`  ${s.warm?'Розминка':'Робочий'} ${i+1}: ${s.kg||'власна вага'} кг × ${s.reps} ${s.rpe||'RPE не вказано'}\n`})}const t=totals(d);return out+`\nПІДСУМКИ: ${t.sets} робочих сетів; ${t.reps} повторень; ${t.volume} кг тоннажу (без розминок; гантелі ×2).\nПрошу перевірити результати. НЕ записуй у Google Sheets без мого окремого підтвердження.`}function download(filename,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset.set)return;const [ei,si,k]=el.dataset.set.split(':');const s=state.draft.exercises[+ei].sets[+si];s[k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();updateLive()});document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.set){const [ei,si,k]=el.dataset.set.split(':');state.draft.exercises[+ei].sets[+si][k]=k==='done'?el.checked:k==='kg'||k==='reps'?(el.value===''?'':Number(el.value)):el.value;save();if(k==='done'){if(el.checked&&!state.draft.exercises[+ei].sets[+si].warm)startRest(state.draft.exercises[+ei].name);render()}else updateLive();return}if(el.id==='chartEx'){document.getElementById('chartArea').innerHTML=graphSvg(el.value);return}if(el.id==='date'){state.draft.date=el.value;save();render()}if(el.id==='program'){if(confirm('Перемкнути програму? Поточна чернетка буде замінена. Спочатку зроби резервну копію, якщо вона потрібна.'))start(el.value);else render()}if(el.dataset.upload!==undefined){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Вибери зображення до 1,5 МБ, щоб не переповнити локальне сховище.');return}const name=state.draft.exercises[+el.dataset.upload].name;const reader=new FileReader();reader.onload=()=>{state.images[name]=reader.result;save();render()};reader.readAsDataURL(f)}if(el.id==='importBackup'){const f=el.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.history)||!x.draft||typeof x.images!=='object')throw Error();if(confirm('Замінити всі локальні дані резервною копією?')){state=x;save();render()}}catch(e){alert('Неправильний файл резервної копії')}};reader.readAsText(f)}});document.addEventListener('click',async ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===el));for(const t of ['train','history','analytics','settings'])document.getElementById(t).classList.toggle('hidden',t!==el.dataset.tab);document.getElementById('footer').style.display=el.dataset.tab==='train'?'flex':'none'}if(el.id==='restSkip'){restEnd=0;try{localStorage.removeItem(REST_KEY)}catch(e){}drawRest()}if(el.dataset.calendar){const h=state.history.filter(x=>x.date===el.dataset.calendar);dialog(`<h3>${esc(el.dataset.calendar)}</h3>${h.length?h.map(x=>`<div class="preview">${esc(report(x))}</div>`).join(''):'<p class="notice">Немає збереженого тренування.</p>'}`)}if(el.dataset.add!==undefined){let e=state.draft.exercises[+el.dataset.add],p=e.sets[e.sets.length-1];e.sets.push({...p,rpe:'',done:false});save();render()}if(el.dataset.remove!==undefined){let e=state.draft.exercises[+el.dataset.remove];if(e.sets.length>1&&confirm('Видалити останній підхід?')){e.sets.pop();save();render()}}if(el.dataset.warm){let [i,j]=el.dataset.warm.split(':').map(Number);state.draft.exercises[i].sets[j].warm=!state.draft.exercises[i].sets[j].warm;save();render()}if(el.dataset.change!==undefined){const i=+el.dataset.change;dialog(`<h2>Замінити вправу</h2><input id="searchEx" type="text" placeholder="Пошук вправи" style="text-align:left"><div id="options">${catalog.map(n=>`<button class="option" data-choose="${i}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`);document.getElementById('searchEx').addEventListener('input',e=>document.querySelectorAll('#options button').forEach(b=>b.style.display=b.dataset.name.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'))}if(el.dataset.choose!==undefined){const i=+el.dataset.choose;const old=state.draft.exercises[i];if(old.sets.some(s=>s.done)&&!confirm('Замінити вправу та її поточні сети?'))return;state.draft.exercises[i]=makeEx(el.dataset.name);save();close();render()}if(el.dataset.detail!==undefined){const h=state.history[+el.dataset.detail];dialog(`<h2>${esc(h.date)} · Full Body ${esc(h.type)}</h2><div class="preview">${esc(report(h))}</div>`)}if(el.id==='closeModal')close();if(el.id==='backup'||el.id==='exportBackup')download('lean-bulk-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(el.id==='resetDraft'&&confirm('Видалити поточну чернетку? Історія залишиться.'))start(state.draft.type);if(el.id==='finish'){const d=state.draft;const incomplete=d.exercises.flatMap(e=>e.sets).filter(s=>!s.warm&&!s.done);if(incomplete.length&&!confirm(`${incomplete.length} робочих сетів не позначені виконаними. Завершити лише з відміченими сетами?`))return;const textReport=report(d);dialog(`<h2>Звіт тренування</h2><p class="notice">Перевір звіт. Натисни «Копіювати» і надішли його в ChatGPT. Збереження в Google Sheets — тільки після твого підтвердження.</p><div class="preview" id="reportText">${esc(textReport)}</div><div class="tools"><button class="btn" id="copyReport">Копіювати звіт</button><button class="btn2" id="archiveWorkout">Зберегти в історію й почати наступне</button></div>`)}if(el.id==='copyReport'){const str=document.getElementById('reportText').textContent;try{await navigator.clipboard.writeText(str);alert('Звіт скопійовано')}catch(e){download('lean-bulk-report-'+state.draft.date+'.txt',str,'text/plain');alert('Звіт збережено як текстовий файл')}}if(el.id==='archiveWorkout'){const d=structuredClone(state.draft);d.exercises=d.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>{delete s.done;return s})})).filter(e=>e.sets.length);if(state.history.some(h=>h.date===d.date&&h.type===d.type)){if(!confirm('Уже є тренування з цією датою й типом. Замінити його?'))return;state.history=state.history.filter(h=>!(h.date===d.date&&h.type===d.type))}state.history.push(d);state.history.sort((a,b)=>a.date.localeCompare(b.date));const next={A:'B',B:'C',C:'A'}[d.type];state.draft={date:today(),type:next,exercises:programs[next].map(makeEx)};save();close();render();alert('Тренування збережено в локальній історії. Звіт потрібно окремо надіслати в ChatGPT.')}});document.addEventListener('click',e=>{const toggle=e.target.closest('[data-map-mode]');if(toggle){window.muscleMode=toggle.dataset.mapMode;renderAnalytics();return}const region=e.target.closest('[data-muscle]');if(region){const info=document.getElementById('muscleInfo');if(info)info.innerHTML=muscleInfo(region.dataset.muscle,['session','week','month'].includes(window.muscleMode)?window.muscleMode:'session');document.querySelectorAll('.muscle-region').forEach(p=>p.classList.toggle('muscle-selected',p.dataset.muscle===region.dataset.muscle))}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-muscle]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('click',e=>{const thumb=e.target.closest('[data-image]');if(thumb)viewArt(Number(thumb.dataset.image))});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
